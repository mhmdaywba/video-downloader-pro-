<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُنزل الفيديو الاحترافي</title>
    <style>
        body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background-color: #0f172a; color: #ffffff; font-size: 20px; }
        .box { background-color: #1e293b; padding: 30px; border-radius: 15px; text-align: center; max-width: 600px; margin: 40px auto; }
        h1 { font-size: 32px; color: #38bdf8; margin-bottom: 20px; }
        p { font-size: 22px; color: #cbd5e1; }
        input { width: 100%; padding: 18px; font-size: 20px; border-radius: 10px; border: 2px solid #334155; background-color: #0f172a; color: #ffffff; box-sizing: border-box; margin-top: 15px; }
        button { width: 100%; padding: 18px; font-size: 22px; font-weight: bold; border-radius: 10px; border: none; background-color: #0d6efd; color: #ffffff; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h1>مُنزل الفيديو الاحترافي</h1>
        <p>ضع رابط الفيديو أدناه للبدء في التحميل</p>
        <input type="url" placeholder="ضع رابط الفيديو هنا...">
        <button type="button">تحميل الآن</button>
    </div>

</body>
</html>
