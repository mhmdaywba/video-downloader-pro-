<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُنزل الفيديو الاحترافي - تحميل فيديوهات بسهولة</title>
    <meta name="description" content="أداة مجانية وسريعة لتنزيل الفيديوهات من مختلف منصات التواصل الاجتماعي بجودة عالية.">
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid #334155;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .downloader-box {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        input[type="url"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input[type="url"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 14px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: var(--card-bg);
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>مُنزِّل الفيديوهات الاحترافي</h1>
    </header>

    <main>
        <div class="downloader-box">
            <h2>تحميل الفيديو بضغطة زر</h2>
            <p style="color: var(--text-muted);">ضع رابط الفيديو في المربع أدناه للبدء بالتحميل</p>
            
            <div class="input-group">
                <input type="url" placeholder="ضع رابط الفيديو هنا (TikTok, Instagram, YouTube...)" required>
                <button type="button">تحميل الآن</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة - Video Downloader Pro</p>
    </footer>

</body>
</html>
